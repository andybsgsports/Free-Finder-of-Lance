name: Daily hunt

on:
  schedule:
    - cron: '0 13 * * *' # 8am US Central
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  hunt:
    # Set a repository variable HUNT_RUNNER to "self-hosted" once you have a
    # runner on your own machine. Craigslist and Reddit both throttle or block
    # GitHub's datacenter IPs; a residential one they leave alone. Unset, this
    # behaves exactly as before.
    runs-on: ${{ vars.HUNT_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test

      # Reads the most recent "Leads — …" issue so today's scan can skip
      # anything it already reported — without this a post near the edge of
      # the lookback window shows up two days running.
      - name: Fetch previous digest
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              sort: 'created',
              direction: 'desc',
              per_page: 10,
            });
            const last = data.find((i) => i.title.startsWith('Leads —'));
            require('node:fs').writeFileSync('seen.md', last ? last.body : '');

      # Optional. Set these two repo secrets and Reddit stops throttling the run.
      # Without them the hunt still works, it just loses sources to 429s.
      - id: scan
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Sources marked "local" (Craigslist) only run on your own runner.
          HUNT_LOCAL: ${{ vars.HUNT_RUNNER != '' }}
        run: node src/index.js --hunt freelance --seen seen.md --out report.md

      # Uses github-script rather than the gh CLI: gh ships on GitHub's hosted
      # runners but not on a machine you set up yourself, and this step has to
      # keep working after you switch HUNT_RUNNER.
      - name: File the digest
        if: steps.scan.outputs.hits != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('node:fs').readFileSync('report.md', 'utf8');
            const day = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Leads — ${day} (${{ steps.scan.outputs.hits }})`,
              body,
            });
