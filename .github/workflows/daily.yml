name: Daily hunt

on:
  schedule:
    - cron: '0 13 * * *' # 8am US Central
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test

      # Optional. Set these two repo secrets and Reddit stops throttling the run.
      # Without them the hunt still works, it just loses sources to 429s.
      - id: scan
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: node src/index.js --hunt freelance --out report.md

      - name: File the digest
        if: steps.scan.outputs.hits != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Leads — $(date -u +%Y-%m-%d) (${{ steps.scan.outputs.hits }})" \
            --body-file report.md
